[project]
name = "perf-status-extraction"
version = "0.1.0"
description = "LLM-based extraction of ECOG, KPS, and Lansky performance status from clinical notes"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "langchain-text-splitters>=0.2",
]

[project.optional-dependencies]
openai = ["openai>=1.0"]
anthropic = ["anthropic>=0.30"]
all = ["openai>=1.0", "anthropic>=0.30"]
eval = ["mlflow>=2.0"]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
